<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problems · Sites</title>
<meta name="description" content="Todos os sites do Problems em um lugar só.">
<meta name="theme-color" content="#00e8e8">
<meta property="og:title" content="Problems · Sites">
<meta property="og:description" content="Todos os sites do Problems em um lugar só.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2300e8e8'/%3E%3Cpath d='M50 30 88 52v60H12V52Z' fill='%23fff' stroke='%23000' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M50 48 43 57M63 55l-6 9M29 66l-1 8' stroke='%23000' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00e8e8;
  --cyan-2:#00d2dc;
  --ink:#0a0a0a;
  --blue:#2a86d6;
  --blue-deep:#0d4a93;
  --sky:#c4f2ff;
  --paper:#f4feff;
  --text:#123a44;
  --soft:#5d8189;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:"Nunito",system-ui,sans-serif;color:var(--text);background:var(--cyan);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding-left:16px;padding-right:16px}

/* ================= HERO ================= */
.hero{position:relative;padding:34px 0 64px;text-align:center;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#5ff6f6 0%,var(--cyan) 55%,var(--cyan-2) 100%)}
.floaters span{position:absolute;width:var(--s);aspect-ratio:1/1.1;background:#fff;opacity:.16;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:drift var(--d) ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-18px) rotate(14deg)}}

.brand{position:relative;width:min(90vw,500px);margin:0 auto;padding-top:clamp(62px,19vw,104px)}
/* o personagem espiando por trás da logo */
.peek{position:absolute;left:50%;top:0;width:clamp(120px,36vw,190px);transform:translateX(-50%);z-index:0;
  animation:peek 5s ease-in-out infinite}
.peek .face{transform-origin:150px 200px;animation:blink 5s infinite}
@keyframes peek{0%,100%{transform:translate(-50%,10px)}12%,70%{transform:translate(-50%,0)}80%{transform:translate(-50%,14px)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.15)}}
.logo{position:relative;z-index:1;display:block;width:100%;height:auto;
  filter:drop-shadow(0 8px 10px rgba(13,74,147,.28))}
.hello{position:relative;z-index:1;margin:16px auto 0;max-width:26ch;font-weight:800;font-size:1.08rem;line-height:1.4;color:#063c46}
.hello b{color:var(--blue-deep)}

/* ================= FOLHA DE CONTEÚDO ================= */
.sheet{position:relative;margin-top:-30px;background:var(--paper);border-radius:32px 32px 0 0;
  box-shadow:0 -10px 30px rgba(0,80,90,.12);padding:26px 0 30px;min-height:60vh}
.sheet-head{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.title h2{margin:0;font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.9rem;color:var(--blue-deep);letter-spacing:.3px}
.pill{font-weight:900;font-size:.85rem;color:var(--blue-deep);background:var(--sky);border-radius:999px;padding:5px 12px;white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:#fff;border-radius:16px;
  border:2px solid #d3f3f6;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,134,214,.15)}
.search svg{flex:none;color:var(--soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-weight:700;font-size:1rem;color:var(--text)}
.search input::placeholder{color:#90aeb4}

/* ================= CARDS DE SITE ================= */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;list-style:none;margin:0;padding:0}
.site{position:relative;display:block;height:100%;background:#fff;border-radius:22px;overflow:hidden;
  box-shadow:0 1px 0 #d8f1f4,0 10px 24px -12px rgba(0,70,90,.28);
  transition:transform .2s cubic-bezier(.2,1.4,.4,1),box-shadow .2s;
  animation:rise .5s ease both;animation-delay:calc(var(--i,0)*70ms)}
.site:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 1px 0 #d8f1f4,0 18px 30px -12px rgba(0,70,90,.35)}
.site:active{transform:scale(.98)}
.site:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* mini janela do navegador com prévia ao vivo */
.window{position:relative;margin:10px 10px 0;border-radius:14px;overflow:hidden;background:var(--c1,#e3fbfc)}
.bar{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;background:#e9fafb}
.bar i{width:9px;height:10px;background:#9fd9df;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.bar i:first-child{background:#4fc3f7}
.bar em{flex:1;margin-left:6px;font-style:normal;font-size:.72rem;font-weight:800;color:var(--soft);background:#fff;border-radius:6px;padding:2px 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot{position:relative;aspect-ratio:16/10;overflow:hidden;
  background:linear-gradient(135deg,var(--c1),var(--c2))}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Lilita One",sans-serif;font-size:3.4rem;color:#fff;
  text-shadow:0 4px 0 rgba(0,0,0,.12)}
.shot iframe{position:absolute;top:0;left:0;width:400%;height:400%;border:0;transform:scale(.25);transform-origin:0 0;
  pointer-events:none;background:#fff;opacity:0;transition:opacity .4s}
.shot iframe.on{opacity:1}
.badge{position:absolute;top:38px;right:10px;z-index:2;font-family:"Lilita One",sans-serif;font-size:.9rem;color:#fff;
  background:#ff5c8a;padding:3px 10px;border-radius:999px;transform:rotate(4deg);box-shadow:0 3px 0 #c93665}

.info{display:flex;align-items:center;gap:12px;padding:14px 16px 16px}
.icon{flex:none;width:44px;height:48px;display:grid;place-items:center;font-size:1.4rem;
  font-family:"Lilita One",sans-serif;color:#fff;background:linear-gradient(var(--c1),var(--c2));
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.icon.img,.ph.img{font-size:0}
.icon img{box-sizing:border-box;width:86%;height:86%;padding:18%;object-fit:contain;background:#fff;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ph img{width:28%;max-width:96px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.txt{flex:1;min-width:0}
.txt h3{margin:0;font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.3rem;line-height:1.15;color:#0b2f38}
.txt p{margin:3px 0 0;font-size:.92rem;font-weight:600;line-height:1.4;color:var(--soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.txt small{display:block;margin-top:6px;font-size:.75rem;font-weight:800;color:#8aaab0}
.go{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(#6fd3f7,var(--blue));box-shadow:0 3px 0 var(--blue-deep);transition:transform .2s}
.site:hover .go{transform:translateX(3px) rotate(-8deg)}

/* carregando */
.skel .shot,.skel .line{background:linear-gradient(100deg,#e7f8f9 40%,#f5fdfe 50%,#e7f8f9 60%) 0 0/300% 100%;animation:shimmer 1.2s linear infinite}
.skel .line{height:14px;border-radius:8px;margin:6px 0}
@keyframes shimmer{to{background-position:-150% 0}}

/* estados */
.state{text-align:center;padding:30px 16px 10px}
.state svg{width:120px;height:auto}
.state h3{margin:8px 0 4px;font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.5rem;color:var(--blue-deep)}
.state p{margin:0 auto;max-width:30ch;font-weight:700;color:var(--soft)}
.hidden{display:none!important}

footer{background:var(--paper);text-align:center;padding:10px 16px 36px;font-weight:800;font-size:.9rem;color:var(--soft)}
footer a{color:var(--blue-deep)}
footer .mini{display:block;width:46px;margin:0 auto 6px}

@media (min-width:640px){
  .hero{padding:50px 0 80px}
  .hello{font-size:1.2rem}
  .sheet{padding-top:36px}
  .sheet-head{flex-direction:row;align-items:center;justify-content:space-between}
  .title{justify-content:flex-start}
  .search{width:320px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
}
@media (min-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- personagem Problems (reutilizado) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="problems" viewBox="0 0 300 330">
    <path d="M150 12 284 88v154L150 318 16 242V88Z" fill="#fff" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
    <g class="face"><path d="M148 84 111 126M215 115l-28 42M61 169l-3 33" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></g>
  </symbol>
</svg>

<header class="hero">
  <div class="floaters" aria-hidden="true">
    <span style="--s:46px;--d:6s;left:6%;top:18%"></span>
    <span style="--s:24px;--d:4s;left:82%;top:12%"></span>
    <span style="--s:64px;--d:7s;left:86%;top:58%"></span>
    <span style="--s:30px;--d:5s;left:12%;top:70%"></span>
    <span style="--s:18px;--d:3.5s;left:62%;top:6%"></span>
  </div>
  <div class="wrap">
    <div class="brand">
      <svg class="peek" viewBox="0 0 300 330" role="img" aria-label="Personagem Problems espiando">
        <path d="M150 12 284 88v154L150 318 16 242V88Z" fill="#fff" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
        <g class="face"><path d="M148 84 111 126M215 115l-28 42M61 169l-3 33" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></g>
      </svg>
      <img class="logo" src="logo.svg" alt="Problems" width="500" height="125">
    </div>
    <p class="hello">Oi! Aqui ficam <b>todos os meus sites</b>. Escolhe um e divirta-se!</p>
  </div>
</header>

<main class="sheet">
  <div class="wrap">
    <div class="sheet-head">
      <div class="title">
        <h2>Meus sites</h2>
        <span class="pill" id="count" aria-live="polite">carregando…</span>
      </div>
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>
        <input id="q" type="search" placeholder="Procurar um site…" autocomplete="off" aria-label="Procurar um site">
      </label>
    </div>

    <ul class="grid" id="grid" aria-busy="true"></ul>

    <div class="state hidden" id="state">
      <svg viewBox="0 0 300 330" aria-hidden="true"><use href="#problems"/></svg>
      <h3 id="state-title">Nada por aqui…</h3>
      <p id="state-msg">Nenhum site com esse nome.</p>
    </div>
  </div>
</main>

<footer>
  <svg class="mini" viewBox="0 0 300 330" aria-hidden="true"><use href="#problems"/></svg>
  Feito com carinho pelo <a href="https://github.com/problemsite">Problems</a>
</footer>

<script>
(() => {
  const USER = "problemsite";
  const HOME = `${USER}.github.io`;
  const CACHE_KEY = "problems-sites-v2";
  const CACHE_TTL = 10 * 60 * 1000;           // 10 min
  const NEW_DAYS = 5;                          // selo "Novo!" para sites atualizados nos últimos 5 dias
  const PALETTES = [["#6fd3f7","#2a86d6"],["#7ef0c9","#15b39a"],["#ffb86b","#ff7a59"],["#c7a4ff","#7b5cf0"],["#ff9ec4","#f0567f"],["#ffe066","#f4a700"]];

  const $ = id => document.getElementById(id);
  const grid = $("grid"), q = $("q"), count = $("count");
  let sites = [];

  const cache = {
    get(){ try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } },
    set(v){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch {} }
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // "jogo-do-impostor" -> "Jogo do Impostor"
  const SMALL = new Set(["de","do","da","dos","das","e","o","a","os","as","em","no","na","com","para","por"]);
  const pretty = n => n.replace(/[-_.]+/g, " ").trim().split(/\s+/)
      .map((w, i) => (i && SMALL.has(w.toLowerCase())) ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");

  // se a descrição começar com emoji, ele vira o ícone do site 😄
  const EMOJI = /^(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)\s*/u;

  function ago(date){
    const d = Math.floor((Date.now() - new Date(date)) / 864e5);
    if (d < 1) return "hoje";
    if (d === 1) return "ontem";
    if (d < 30) return `há ${d} dias`;
    const m = Math.floor(d / 30);
    if (m < 12) return m === 1 ? "há 1 mês" : `há ${m} meses`;
    const y = Math.floor(m / 12);
    return y === 1 ? "há 1 ano" : `há ${y} anos`;
  }

  function hash(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

  async function fetchSites(){
    let page = 1, all = [];
    for (;;) {
      const res = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed&page=${page}`);
      if (!res.ok) throw new Error(res.status === 403 ? "limite" : "erro");
      const data = await res.json();
      all = all.concat(data);
      if (data.length < 100) break;
      page++;
    }
    return all
      .filter(r => r.has_pages && !r.archived && r.name.toLowerCase() !== HOME)
      .map(r => {
        let desc = r.description || "", emoji = "";
        const m = desc.match(EMOJI);
        if (m) { emoji = m[1]; desc = desc.slice(m[0].length); }
        return {
          name: r.name,
          title: pretty(r.name),
          desc, emoji,
          url: (r.homepage && /^https?:\/\//i.test(r.homepage)) ? r.homepage : `https://${HOME}/${r.name}/`,
          created: r.created_at,
          pushed: r.pushed_at
        };
      })
      .sort((a, b) => new Date(b.pushed) - new Date(a.pushed));
  }

  function card(s, i){
    const [c1, c2] = PALETTES[hash(s.name) % PALETTES.length];
    const isNew = (Date.now() - new Date(s.pushed)) / 864e5 < NEW_DAYS;
    const domain = s.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    const icon = s.emoji || esc(s.title.charAt(0));
    return `
      <li>
        <a class="site" href="${esc(s.url)}" style="--i:${i};--c1:${c1};--c2:${c2}">
          <div class="window">
            <div class="bar"><i></i><i></i><i></i><em>${esc(domain)}</em></div>
            <div class="shot">
              <div class="ph" data-site="${esc(s.url)}" aria-hidden="true">${icon}</div>
              <iframe data-src="${esc(s.url)}" title="Prévia de ${esc(s.title)}" tabindex="-1" aria-hidden="true" scrolling="no"></iframe>
            </div>
          </div>
          ${isNew ? `<span class="badge">Novo!</span>` : ""}
          <div class="info">
            <span class="icon" data-site="${esc(s.url)}" aria-hidden="true">${icon}</span>
            <div class="txt">
              <h3>${esc(s.title)}</h3>
              ${s.desc ? `<p>${esc(s.desc)}</p>` : ""}
              <small>Atualizado ${ago(s.pushed)}</small>
            </div>
            <span class="go" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </div>
        </a>
      </li>`;
  }

  // prévias só carregam quando o card aparece na tela
  const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const f = e.target;
      f.addEventListener("load", () => f.classList.add("on"), { once: true });
      f.src = f.dataset.src;
      io.unobserve(f);
    }
  }, { rootMargin: "200px" }) : null;

  // ---------- ícone/favicon de cada site ----------
  const ICON_KEY = "problems-icons-v2";
  let icons = {};
  try { icons = JSON.parse(localStorage.getItem(ICON_KEY)) || {}; } catch {}
  const saveIcons = () => { try { localStorage.setItem(ICON_KEY, JSON.stringify(icons)); } catch {} };
  const pending = {};

  const loads = src => new Promise(ok => {
    const img = new Image();
    img.onload = () => ok(img.naturalWidth > 0);
    img.onerror = () => ok(false);
    img.src = src;
  });

  async function findIcon(url){
    const found = [];
    try {
      const res = await fetch(url, { cache: "force-cache" });
      if (res.ok) {
        const doc = new DOMParser().parseFromString(await res.text(), "text/html");
        const base = doc.querySelector("base[href]") ? new URL(doc.querySelector("base").getAttribute("href"), res.url).href : res.url;
        const score = l => {
          const rel = (l.getAttribute("rel") || "").toLowerCase();
          const type = (l.getAttribute("type") || "").toLowerCase();
          const href = l.getAttribute("href") || "";
          if (type.includes("svg") || /\.svg(\?|$)/i.test(href)) return 10000;          // SVG = melhor qualidade
          const size = Math.max(0, ...(l.getAttribute("sizes") || "").split(/\s+/).map(v => parseInt(v, 10) || 0));
          return size + (rel.includes("apple-touch-icon") ? 180 : 0);
        };
        [...doc.querySelectorAll('link[rel~="icon" i], link[rel*="apple-touch-icon" i]')]
          .filter(l => l.getAttribute("href"))
          .sort((a, b) => score(b) - score(a))
          .forEach(l => { try { found.push(new URL(l.getAttribute("href"), base).href); } catch {} });
      }
    } catch {}
    found.push(new URL("favicon.ico", url).href);                                  // último recurso
    for (const src of found) if (await loads(src)) return src;
    return "";
  }

  function paintIcons(){
    grid.querySelectorAll("[data-site]").forEach(async el => {
      const url = el.dataset.site;
      const c = icons[url];
      if (!c || Date.now() - c.ts > 864e5) {                                         // revalida 1x por dia
        pending[url] = pending[url] || findIcon(url);
        icons[url] = { src: await pending[url], ts: Date.now() };
        saveIcons();
      }
      const src = icons[url].src;
      if (src && !el.classList.contains("img")) {
        el.innerHTML = ""; const img = new Image(); img.alt = ""; img.src = src;
        img.onerror = () => { delete icons[url]; saveIcons(); };
        el.appendChild(img); el.classList.add("img");
      }
    });
  }

  function showState(title, msg){
    $("state-title").textContent = title; $("state-msg").textContent = msg;
    $("state").classList.remove("hidden");
  }

  function render(){
    const t = q.value.trim().toLowerCase();
    const list = t ? sites.filter(s => `${s.title} ${s.name} ${s.desc}`.toLowerCase().includes(t)) : sites;
    count.textContent = sites.length === 1 ? "1 site no ar" : `${sites.length} sites no ar`;
    grid.innerHTML = list.map(card).join("");
    grid.setAttribute("aria-busy", "false");
    $("state").classList.add("hidden");
    if (!sites.length) showState("Em breve!", "Ainda não tem nenhum site publicado. Volta daqui a pouco!");
    else if (!list.length) showState("Nada por aqui…", "Nenhum site com esse nome.");
    grid.querySelectorAll("iframe").forEach(f => io ? io.observe(f) : (f.src = f.dataset.src));
    paintIcons();
  }

  function skeleton(){
    grid.innerHTML = Array.from({ length: 3 }, () =>
      `<li><div class="site skel"><div class="window"><div class="bar"></div><div class="shot"></div></div>
       <div class="info"><div class="txt"><div class="line" style="width:60%"></div><div class="line"></div></div></div></div></li>`).join("");
  }

  async function load(){
    const c = cache.get();
    if (c && Array.isArray(c.sites)) { sites = c.sites; render(); } else skeleton();
    if (c && Date.now() - c.ts < CACHE_TTL) return;
    try {
      const fresh = await fetchSites();
      cache.set({ ts: Date.now(), sites: fresh });
      if (JSON.stringify(fresh) !== JSON.stringify(sites) || !c) { sites = fresh; render(); }
    } catch (e) {
      if (!c) {
        grid.innerHTML = ""; count.textContent = "ops!";
        showState("Deu um problema!", e.message === "limite"
          ? "Muita gente visitou ao mesmo tempo. Espera um minutinho e recarrega a página."
          : "Não consegui carregar a lista agora. Tenta recarregar a página.");
      }
    }
  }

  q.addEventListener("input", render);
  load();
})();
</script>
</body>
</html>
